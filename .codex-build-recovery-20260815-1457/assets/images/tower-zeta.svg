<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="zetaAura" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdefff" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#d68bff" stop-opacity="0.72" />
    </linearGradient>
    
    <!-- A single pendulum rotates smoothly around the tower's center. -->
    <g id="zetaPendulum">
      <line x1="32" y1="32" x2="32" y2="42" stroke="#a8b8c8" stroke-width="1" opacity="0.7" />
      <circle cx="32" cy="42" r="2" fill="#a8b8c8" opacity="0.85" />
      <animateTransform 
        attributeName="transform" 
        type="rotate"
        from="0 32 32"
        to="360 32 32"
        dur="4s"
        calcMode="linear"
        repeatCount="indefinite" />
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0c13" />
  <circle cx="32" cy="32" r="22" fill="#141a2d" stroke="#f0f5ff" stroke-width="2" opacity="0.92" />
  <circle cx="32" cy="32" r="16" fill="url(#zetaAura)" opacity="0.92" />
  
  <!-- Smooth orbital pendulum animation behind the letter. -->
  <g id="pendulumOrbit" opacity="0.8">
    <use href="#zetaPendulum" />
  </g>
  
  <text
    x="31.5"
    y="38.5"
    font-family="'Cormorant Garamond', serif"
    font-size="26"
    text-anchor="middle"
  
    fill="#ffffff"
    stroke="#000000"
    stroke-width="1.5"
    paint-order="stroke"
  >ζ</text>
</svg>
